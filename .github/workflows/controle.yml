name: Contrôle automatique

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Syntaxe et mise en forme des scripts
        run: |
          ruff check .
          ruff format --check .
      - name: Les valeurs attendues se retrouvent dans les données
        run: python reference.py
